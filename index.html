<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>@will.</title>
  <meta name="description" content="hello twin" />
  <meta name="theme-color" content="#194c4c" />
  <meta property="og:title" content="@will." />
  <meta property="og:description" content="hello twin" />
  <meta property="og:image" content="assets/github-avatar.jpg" />
  <link rel="icon" href="assets/github-avatar.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #194c4c;
      --text: #dff3f3;
      --icon: #dff3f3;
      --glow: #3fb6b6;
      --effects: #838a91;
      --badge: #298579;
      --font: "Fira Code", ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      color: var(--text);
      background: #050b0b;
      overflow: hidden;
      cursor: default;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    a { color: inherit; }

    /* ---------- background video + tv effect ---------- */
    #bg {
      position: fixed; inset: -10px;
      width: calc(100% + 20px); height: calc(100% + 20px);
      object-fit: cover;
      filter: blur(1px);
      z-index: 0;
    }
    .tv { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
    .tv.scanlines {
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, 0.22) 3px,
        rgba(0, 0, 0, 0) 4px
      );
      animation: flicker 0.15s infinite;
    }
    .tv.vignette {
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.65) 100%);
    }
    .tv.roll::after {
      content: ""; position: absolute; left: 0; right: 0; height: 22vh;
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.06), rgba(255,255,255,0));
      animation: roll 7s linear infinite;
    }
    #noise { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; opacity: 0.05; }
    @keyframes flicker { 0% { opacity: .92 } 50% { opacity: 1 } 100% { opacity: .95 } }
    @keyframes roll { from { top: -25vh } to { top: 110vh } }

    /* ---------- enter screen ---------- */
    #enter {
      position: fixed; inset: 0; z-index: 50;
      display: grid; place-items: center;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      cursor: pointer;
      transition: opacity .9s ease, visibility .9s;
    }
    #enter span {
      color: #e8f3f3; font-size: clamp(1rem, 3vw, 1.35rem); letter-spacing: .08em;
      text-shadow: 0 0 12px rgba(63, 182, 182, .8);
      animation: pulse 2.2s ease-in-out infinite;
    }
    #enter.gone { opacity: 0; visibility: hidden; }
    @keyframes pulse { 50% { opacity: .45 } }

    /* ---------- layout ---------- */
    main {
      position: relative; z-index: 5;
      min-height: 100%; display: grid; place-items: center;
      grid-template-columns: minmax(0, 1fr);
      padding: 16px;
      perspective: 1000px;
    }
    .card {
      width: min(560px, 100%);
      padding: 28px 26px 20px;
      border-radius: 22px;
      background: rgba(0, 0, 0, 0);
      text-align: center;
      transform-style: preserve-3d;
      transition: transform .15s ease-out;
      opacity: 0;
    }
    .card.show { animation: unfold 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes unfold {
      0%   { opacity: 0; transform: scale(0.1, 0.004); }
      40%  { opacity: 1; transform: scale(1, 0.004); }
      100% { opacity: 1; transform: scale(1, 1); }
    }

    .top-row { position: relative; }
    .avatar {
      width: 118px; height: 118px; border-radius: 100%;
      object-fit: cover; display: block; margin: 0 auto 12px;
      box-shadow: 0 0 22px rgba(25, 76, 76, .6);
    }
    .name-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
    h1 {
      font-size: 2.1rem; font-weight: 700; letter-spacing: -.01em;
      text-shadow: 0 0 6px var(--glow), 0 0 18px var(--accent), 0 2px 2px rgba(0,0,0,.4);
    }
    .badges { display: flex; gap: 6px; align-items: center; }
    .badge {
      width: 22px; height: 22px; display: inline-block;
      background: #5fd3c2;
      filter: drop-shadow(0 0 5px var(--badge));
      -webkit-mask: var(--src) center / contain no-repeat;
              mask: var(--src) center / contain no-repeat;
      position: relative;
    }
    .tip {
      position: fixed; z-index: 60; pointer-events: none;
      background: rgba(0,0,0,.85); color: #e8f3f3; font-size: .72rem;
      padding: 5px 9px; border-radius: 7px; opacity: 0; transition: opacity .15s;
      transform: translate(-50%, -130%);
    }
    .tip.on { opacity: 1; }
    .bio { margin-top: 6px; font-size: 1rem; font-weight: 500; text-shadow: 0 0 10px var(--accent), 0 1px 2px rgba(0,0,0,.5); }

    /* discord presence */
    .presence {
      display: flex; align-items: center; gap: 12px;
      margin: 20px auto 0; padding: 12px 14px; max-width: 420px;
      border-radius: 14px;
      background: rgba(5, 22, 22, .55);
      border: 1px solid rgba(25, 76, 76, .45);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      text-align: left;
    }
    .presence .pfp { position: relative; flex: none; width: 56px; height: 56px; }
    .presence .pfp img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; display: block; }
    .presence .pfp .deco { position: absolute; inset: -6px; width: 68px; height: 68px; border-radius: 0; pointer-events: none; }
    .presence .status {
      position: absolute; right: -1px; bottom: -1px;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--status, #80848e);
      border: 3px solid #0a1c1c;
      box-shadow: 0 0 8px var(--status, transparent);
      transition: background .3s;
    }
    .presence .who { flex: 1; min-width: 0; }
    .presence b { display: block; font-size: 1rem; text-shadow: 0 0 8px var(--glow); }
    .presence small { display: block; font-size: .78rem; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .presence .activity { margin-top: 3px; font-size: .74rem; opacity: .85; }
    .presence .activity:empty { display: none; }
    .presence .art { flex: none; width: 46px; height: 46px; border-radius: 8px; object-fit: cover; box-shadow: 0 0 10px rgba(0,0,0,.4); }
    .presence .art[hidden] { display: none; }

    /* socials */
    .socials { display: flex; justify-content: center; gap: 16px; margin-top: 20px; }
    .social {
      width: 34px; height: 34px; display: inline-block;
      background: var(--icon);
      -webkit-mask: var(--src) center / 30px no-repeat;
              mask: var(--src) center / 30px no-repeat;
      transition: transform .2s ease, background .2s;
    }
    .social:hover { transform: translateY(-3px) scale(1.08); background: #7fe0e0; }
    .social { filter: drop-shadow(0 0 6px var(--accent)); }

    /* audio player */
    .player {
      margin: 20px auto 0; max-width: 420px; padding: 12px 14px;
      border-radius: 14px;
      background: rgba(5, 22, 22, .55);
      border: 1px solid rgba(25, 76, 76, .45);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      text-align: left;
    }
    .player .title { font-size: .85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player .bar-row { display: flex; align-items: center; gap: 8px; font-size: .7rem; margin-top: 8px; }
    .bar { flex: 1; height: 4px; border-radius: 4px; background: rgba(223, 243, 243, .2); cursor: pointer; position: relative; }
    .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 4px; background: var(--text); box-shadow: 0 0 6px var(--glow); }
    .controls { display: flex; justify-content: center; gap: 18px; margin-top: 8px; }
    .controls button { width: 26px; height: 26px; display: grid; place-items: center; }
    .controls svg { width: 20px; height: 20px; fill: var(--text); }

    /* spotify second tab */
    .tabs { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }
    .tabs button { width: 8px; height: 8px; border-radius: 50%; background: rgba(223, 243, 243, .3); }
    .tabs button.on { background: var(--text); box-shadow: 0 0 6px var(--glow); }
    .pane[hidden] { display: none; }
    .pane.spotify iframe { width: 100%; max-width: 420px; height: 152px; border: 0; border-radius: 12px; margin-top: 20px; }

    /* volume */
    .volume {
      position: fixed; top: 16px; left: 16px; z-index: 20;
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 12px;
      background: rgba(0,0,0,.25); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      opacity: 0; transition: opacity .6s;
    }
    .volume.show { opacity: 1; }
    .volume svg { width: 20px; height: 20px; fill: #cfe7e7; }
    .volume input { width: 0; opacity: 0; transition: width .3s, opacity .3s; accent-color: #3fb6b6; }
    .volume:hover input, .volume:focus-within input { width: 90px; opacity: 1; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px);
      z-index: 60; background: rgba(0,0,0,.8); color: #e8f3f3;
      padding: 8px 14px; border-radius: 10px; font-size: .8rem;
      opacity: 0; transition: opacity .25s, transform .25s;
    }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }

    #ghost { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 40; }

    @media (max-width: 480px) {
      .card { padding: 22px 12px 16px; }
      h1 { font-size: 1.7rem; }
      .avatar { width: 96px; height: 96px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tv.scanlines, .tv.roll::after, #enter span { animation: none; }
      .card.show { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <video id="bg" src="assets/bg.mp4" autoplay muted loop playsinline></video>
  <canvas id="noise"></canvas>
  <div class="tv scanlines"></div>
  <div class="tv roll"></div>
  <div class="tv vignette"></div>

  <div id="enter" role="button" tabindex="0" aria-label="Enter"><span>ようこそ見知らぬ人</span></div>

  <div class="volume" id="volume">
    <button id="mute" aria-label="Mute">
      <svg viewBox="0 0 24 24" id="volIcon"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    </button>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Volume" />
  </div>

  <main>
    <div class="card" id="card">
      <div class="pane profile">
        <img class="avatar" src="assets/github-avatar.jpg" alt="will's avatar" />
        <div class="name-row">
          <h1>will.</h1>
          <div class="badges">
            <span class="badge" data-label="Premium" style="--src:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path d=%22M6 3h12l4 6-10 12L2 9z%22/></svg>')"></span>
            <span class="badge" data-label="HypeSquad Bravery" style="--src:url('assets/hypesquad-bravery.png')"></span>
          </div>
        </div>
        <p class="bio">hello twin</p>

        <div class="presence" id="presence">
          <div class="pfp" data-label="offline" id="pfp">
            <img src="assets/github-avatar.jpg" alt="" id="dcAvatar" />
            <img class="deco" id="dcDeco" alt="" hidden />
            <span class="status" id="dcStatus"></span>
          </div>
          <div class="who">
            <b id="dcName">will</b>
            <small id="dcLine">@xfqh</small>
            <div class="activity" id="dcActivity"></div>
          </div>
          <img class="art" id="dcArt" alt="" hidden />
        </div>

        <div class="socials">
          <a class="social" data-label="Steam" href="https://steamcommunity.com/id/inbasswetrust" target="_blank" rel="noopener" aria-label="Steam" style="--src:url('assets/steam.svg')"></a>
          <button class="social" data-label="Discord: xfqh" data-copy="xfqh" aria-label="Copy Discord username" style="--src:url('assets/discord.svg')"></button>
          <a class="social" data-label="Spotify" href="https://open.spotify.com/user/3xg64sbxfvkqv9zug9f0zyqdv?si=179c2eb8b53d430e" target="_blank" rel="noopener" aria-label="Spotify" style="--src:url('assets/spotify.svg')"></a>
        </div>

        <div class="player">
          <div class="title" id="trackTitle">fakemink - ragebait</div>
          <div class="bar-row">
            <span id="cur">0:00</span>
            <div class="bar" id="bar"><i id="fill"></i></div>
            <span id="dur">1:58</span>
          </div>
          <div class="controls">
            <button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
            <button id="play" aria-label="Play/Pause"><svg viewBox="0 0 24 24" id="playIcon"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button>
            <button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
          </div>
        </div>
      </div>

      <div class="pane spotify" hidden>
        <iframe id="spEmbed" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" title="Spotify"></iframe>
      </div>

      <div class="tabs">
        <button class="on" data-tab="profile" aria-label="Profile tab"></button>
        <button data-tab="spotify" aria-label="Spotify tab"></button>
      </div>
    </div>
  </main>

  <div class="tip" id="tip"></div>
  <div class="toast" id="toast">copied</div>
  <canvas id="ghost"></canvas>

  <script>
    const $ = (s) => document.querySelector(s);

    /* ---------- tracks ---------- */
    const tracks = [
      { title: "fakemink - ragebait", src: "assets/ragebait.mp3", spotify: "7aZBSFhGXglejp3tvnkMM0" },
      { title: "yhapojj - 1o", src: "assets/1o.mp3", spotify: "6PPMkUsYO9kLYVwDJ1ewjY" },
    ];
    let ti = 0;
    const audio = new Audio(tracks[0].src);
    audio.volume = 0.5;
    const fmt = (s) => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}` : "0:00";
    const PLAY = '<path d="M7 5v14l11-7z"/>';
    const PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

    function load(i, autoplay = true) {
      ti = (i + tracks.length) % tracks.length;
      audio.src = tracks[ti].src;
      $("#trackTitle").textContent = tracks[ti].title;
      syncEmbed();
      if (autoplay) audio.play().catch(() => {});
    }
    // the spotify tab always shows whichever song the player is on
    const embedUrl = () => `https://open.spotify.com/embed/track/${tracks[ti].spotify}?utm_source=generator&theme=0`;
    function syncEmbed() {
      const f = $("#spEmbed");
      if (!f.closest(".pane").hidden && f.src !== embedUrl()) f.src = embedUrl();
    }
    audio.addEventListener("timeupdate", () => {
      $("#cur").textContent = fmt(audio.currentTime);
      $("#fill").style.width = audio.duration ? (audio.currentTime / audio.duration) * 100 + "%" : 0;
    });
    audio.addEventListener("loadedmetadata", () => ($("#dur").textContent = fmt(audio.duration)));
    audio.addEventListener("ended", () => load(ti + 1));
    audio.addEventListener("play", () => ($("#playIcon").innerHTML = PAUSE));
    audio.addEventListener("pause", () => ($("#playIcon").innerHTML = PLAY));
    $("#play").onclick = () => (audio.paused ? audio.play() : audio.pause());
    $("#prev").onclick = () => (audio.currentTime > 3 ? (audio.currentTime = 0) : load(ti - 1));
    $("#next").onclick = () => load(ti + 1);
    $("#bar").onclick = (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      if (audio.duration) audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
    };

    /* ---------- volume ---------- */
    const VOL_ON = $("#volIcon").innerHTML;
    const VOL_OFF = '<path d="M3 10v4h4l5 5V5L7 10H3zm13.6 2 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/>';
    $("#vol").oninput = (e) => { audio.volume = +e.target.value; audio.muted = false; syncVol(); };
    $("#mute").onclick = () => { audio.muted = !audio.muted; syncVol(); };
    function syncVol() { $("#volIcon").innerHTML = audio.muted || audio.volume === 0 ? VOL_OFF : VOL_ON; }

    /* ---------- enter ---------- */
    function enter() {
      const el = $("#enter");
      if (el.classList.contains("gone")) return;
      el.classList.add("gone");
      $("#card").classList.add("show");
      $("#volume").classList.add("show");
      $("#bg").play().catch(() => {});
      audio.play().catch(() => {});
    }
    $("#enter").addEventListener("click", enter);
    $("#enter").addEventListener("keydown", (e) => (e.key === "Enter" || e.key === " ") && enter());

    /* ---------- tabs ---------- */
    document.querySelectorAll(".tabs button").forEach((b) => {
      b.onclick = () => {
        document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
        document.querySelectorAll(".pane").forEach((p) => (p.hidden = !p.classList.contains(b.dataset.tab)));
        if (b.dataset.tab === "spotify") syncEmbed();
      };
    });

    /* ---------- copy discord ---------- */
    document.querySelectorAll("[data-copy]").forEach((b) => {
      b.onclick = async () => {
        try { await navigator.clipboard.writeText(b.dataset.copy); } catch {}
        const t = $("#toast");
        t.textContent = `copied "${b.dataset.copy}"`;
        t.classList.add("on");
        clearTimeout(t._h);
        t._h = setTimeout(() => t.classList.remove("on"), 1600);
      };
    });

    /* ---------- tooltips ---------- */
    const tip = $("#tip");
    document.querySelectorAll("[data-label]").forEach((el) => {
      el.addEventListener("mouseenter", () => {
        const r = el.getBoundingClientRect();
        tip.textContent = el.dataset.label;
        tip.style.left = r.left + r.width / 2 + "px";
        tip.style.top = r.top + "px";
        tip.classList.add("on");
      });
      el.addEventListener("mouseleave", () => tip.classList.remove("on"));
    });

    /* ---------- parallax tilt ---------- */
    const card = $("#card");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!reduce && matchMedia("(pointer: fine)").matches) {
      let tilt = null;
      addEventListener("mousemove", (e) => {
        if (!card.classList.contains("show")) return;
        if (!tilt) requestAnimationFrame(() => {
          card.style.transform = `rotateY(${tilt.x * 14}deg) rotateX(${-tilt.y * 14}deg)`;
          tilt = null;
        });
        tilt = { x: e.clientX / innerWidth - 0.5, y: e.clientY / innerHeight - 0.5 };
      });
      card.addEventListener("animationend", () => (card.style.animation = "none", card.style.opacity = 1));
    }

    /* ---------- animated tab title ---------- */
    (function titleLoop() {
      const full = "@will.";
      let i = 0, dir = 1;
      setInterval(() => {
        i += dir;
        if (i >= full.length) dir = -1;
        if (i <= 1) dir = 1;
        document.title = full.slice(0, i) || "@";
      }, 450);
    })();

    /* ---------- tv noise ---------- */
    (function noise() {
      const c = $("#noise"), x = c.getContext("2d");
      const w = (c.width = 160), h = (c.height = 90);
      const img = x.createImageData(w, h);
      (function frame() {
        for (let i = 0; i < img.data.length; i += 4) {
          const v = (Math.random() * 255) | 0;
          img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
        x.putImageData(img, 0, 0);
        if (!reduce) setTimeout(() => requestAnimationFrame(frame), 60);
      })();
    })();

    /* ---------- live discord status (lanyard) ---------- */
    (function discordPresence() {
      const DISCORD_ID = "436653059544842241";
      const COLORS = { online: "#23a55a", idle: "#f0b232", dnd: "#f23f43", offline: "#80848e" };
      const LABELS = { online: "online", idle: "idle", dnd: "do not disturb", offline: "offline" };
      let timer = null;

      const esc = (t) => String(t).replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
      const elapsed = (start) => {
        const s = Math.max(0, Math.floor((Date.now() - start) / 1000));
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
        return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
      };
      function assetUrl(appId, img) {
        if (!img) return null;
        if (img.startsWith("mp:external/")) return "https://media.discordapp.net/external/" + img.slice(12);
        if (img.startsWith("spotify:")) return "https://i.scdn.co/image/" + img.slice(8);
        return `https://cdn.discordapp.com/app-assets/${appId}/${img}.png`;
      }

      function render(d) {
        const status = d.discord_status || "offline";
        const pfp = $("#pfp");
        pfp.style.setProperty("--status", COLORS[status]);
        pfp.dataset.label = LABELS[status];

        const u = d.discord_user || {};
        const deco = u.avatar_decoration_data;
        $("#dcDeco").hidden = !deco;
        if (deco) $("#dcDeco").src = `https://cdn.discordapp.com/avatar-decoration-presets/${deco.asset}.png?size=96&passthrough=true`;
        $("#dcName").textContent = u.global_name || u.display_name || "will";

        const acts = d.activities || [];
        const custom = acts.find((a) => a.type === 4);
        const main = acts.find((a) => a.type !== 4);
        const emoji = custom && custom.emoji
          ? custom.emoji.id
            ? `<img src="https://cdn.discordapp.com/emojis/${custom.emoji.id}.${custom.emoji.animated ? "gif" : "png"}?size=32" style="width:14px;height:14px;vertical-align:-2px" alt=""> `
            : esc(custom.emoji.name) + " "
          : "";
        $("#dcLine").innerHTML = custom && (custom.state || emoji) ? emoji + esc(custom.state || "") : "@" + esc(u.username || "xfqh");

        clearInterval(timer);
        const actEl = $("#dcActivity"), art = $("#dcArt");
        art.hidden = true;
        actEl.textContent = "";
        if (d.listening_to_spotify && d.spotify) {
          const sp = d.spotify;
          actEl.innerHTML = `listening to <b style="display:inline;font-size:inherit">${esc(sp.song)}</b> by ${esc(sp.artist.replace(/;/g, ","))}`;
          if (sp.album_art_url) { art.src = sp.album_art_url; art.hidden = false; }
        } else if (main) {
          const verb = ["playing", "streaming", "listening to", "watching", "", "competing in"][main.type] || "playing";
          const detail = [main.details, main.state].filter(Boolean).map(esc).join(" · ");
          const tick = () => {
            const t = main.timestamps && main.timestamps.start ? ` — ${elapsed(main.timestamps.start)}` : "";
            actEl.innerHTML = `${verb} <b style="display:inline;font-size:inherit">${esc(main.name)}</b>${t}${detail ? "<br>" + detail : ""}`;
          };
          tick();
          if (main.timestamps && main.timestamps.start) timer = setInterval(tick, 1000);
          const img = main.assets && assetUrl(main.application_id, main.assets.large_image);
          if (img) { art.src = img; art.hidden = false; }
        } else if (status === "offline") {
          actEl.textContent = "currently offline";
        }
      }

      // lanyard pushes presence changes over a websocket; reconnect if it drops
      function connect() {
        const ws = new WebSocket("wss://api.lanyard.rest/socket");
        let hb = null;
        ws.onmessage = (ev) => {
          const msg = JSON.parse(ev.data);
          if (msg.op === 1) {
            hb = setInterval(() => ws.readyState === 1 && ws.send(JSON.stringify({ op: 3 })), msg.d.heartbeat_interval);
            ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: DISCORD_ID } }));
          } else if (msg.op === 0 && (msg.t === "INIT_STATE" || msg.t === "PRESENCE_UPDATE")) {
            render(msg.d);
          }
        };
        ws.onclose = () => { clearInterval(hb); setTimeout(connect, 5000); };
      }

      // one REST call first: if lanyard isn't tracking the account, keep the static card
      fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`)
        .then((r) => r.json())
        .then((j) => {
          if (!j.success) {
            console.warn("[presence] lanyard isn't tracking this account yet — join discord.gg/lanyard");
            return;
          }
          render(j.data);
          connect();
        })
        .catch(() => {});
    })();

    /* ---------- ghost cursor trail ---------- */
    (function ghost() {
      if (!matchMedia("(pointer: fine)").matches || reduce) return;
      const c = $("#ghost"), x = c.getContext("2d");
      let dpr = 1;
      const size = () => {
        dpr = devicePixelRatio || 1;
        c.width = innerWidth * dpr;
        c.height = innerHeight * dpr;
      };
      size();
      addEventListener("resize", size);

      // the regular cursor arrow, drawn at the pointer's hot spot (its tip)
      const arrow = new Path2D("M0 0 L0 17 L4.6 12.6 L7.6 19.4 L10.4 18.2 L7.4 11.5 L13.2 11.5 Z");
      const ghosts = [];
      let last = null, running = false;

      function add(px, py) {
        // fill the gap on fast flicks so the trail stays continuous
        if (last) {
          const dx = px - last.x, dy = py - last.y, dist = Math.hypot(dx, dy);
          const steps = Math.min(Math.floor(dist / 10), 12);
          for (let i = 1; i <= steps; i++) ghosts.push({ x: last.x + (dx * i) / (steps + 1), y: last.y + (dy * i) / (steps + 1), life: 1 });
        }
        ghosts.push({ x: px, y: py, life: 1 });
        last = { x: px, y: py };
        if (!running) { running = true; requestAnimationFrame(draw); }
      }

      addEventListener("pointermove", (e) => {
        const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
        for (const ev of evs.length ? evs : [e]) add(ev.clientX, ev.clientY);
      }, { passive: true });
      document.addEventListener("mouseleave", () => (last = null));

      function draw() {
        x.setTransform(1, 0, 0, 1, 0, 0);
        x.clearRect(0, 0, c.width, c.height);
        for (let i = ghosts.length - 1; i >= 0; i--) {
          const g = ghosts[i];
          g.life -= 0.045;
          if (g.life <= 0) { ghosts.splice(i, 1); continue; }
          x.setTransform(dpr, 0, 0, dpr, g.x * dpr, g.y * dpr);
          x.globalAlpha = g.life * 0.5;
          x.fillStyle = "#838a91";
          x.fill(arrow);
          x.strokeStyle = "rgba(255,255,255,.55)";
          x.lineWidth = 1;
          x.stroke(arrow);
        }
        if (ghosts.length) requestAnimationFrame(draw);
        else running = false;
      }
    })();
  </script>
</body>
